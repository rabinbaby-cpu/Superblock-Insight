version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable || true
        - corepack prepare pnpm@10.4.1 --activate || npm install -g pnpm@10
        - pnpm install --no-frozen-lockfile
    build:
      commands:
        - pnpm run build
  artifacts:
    baseDirectory: dist/public
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
